bio: "Bonnie has an interdisciplinary background. In her Bachelor of Science (Hons), she studied plant ecology, philosophy of science and geography. Her PhD was on improving environmental judgements and decision making, with the environmental science group at the University of Melbourne. Her postdoctoral work was on horizon scanning for biodiversity conservation ([University of Melbourne](https://findanexpert.unimelb.edu.au/profile/140504-bonnie-wintle)) and existential risks ([CSER, University of Cambridge](https://www.cser.ac.uk/team/bonnie-wintle/)). Now working in the area of ‘metascience’ (with MetaMelb), Bonnie develops structured methods for eliciting and aggregating quantitative and qualitative judgements from groups of experts, to support better decision and policy making.\n\nHer interests include:\n\n-   Meta-research\n\n-   Expert Judgement\n\n-   Environmental Decision Making\n\n-   Horizon Scanning"
