summary: "We present a horizon scan of global catastrophic risks, with an emphasis on new and neglected tipping points with cascade potential.\n\n25 experts presented 96 concerns, which were narrowed down to 15 for discussion. We outline paths to use our findings for prevention, mitigation, and adaptation."
