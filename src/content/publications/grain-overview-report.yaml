summary: "GRAIN investigates how nodes in our global trade system can build up stockpiles, anticipate failsafes, and invest to enable long-term resilience.\n\nAs a toolkit of futures methods and resilience, GRAIN outlines how commercial policy can be synergic, with key commodities as exemplars. The report presents mission-oriented solutions to complexity, bolstering ‘nodes of persisting recovery’."
authors: "Giuseppe Dal Prá, James Balzer, Roman Coussement, Christopher Yan-Chak Chan"
