bio: "Richard Hames is a political theorist and journalist. He is the co-author of Post-Internet Far Right (Dog Section, 2021) and The Rise of Ecofascism: Climate Change and the Far Right (Polity Press, 2022) and an editor of Crude Futures (New Models, 2023). He is a host of Novara FM and its Series Producer. He is currently working on a book project on collapse with Beau-Caprice Vetch."
