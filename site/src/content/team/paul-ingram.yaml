bio: "Paul has been involved in efforts to improve methods of deliberative democracy for many years, since being an Oxford City Councillor (1996-2002) and co-Leader of the Council in a shared Administration (2000-02).\n\nHe has also been the Executive Director of the registered charity British American Security Information Council ([www.basicint.org](http://www.basicint.org)) developing public education around the issue of nuclear deterrence and disarmament (2007-19).\n\nBASIC received funding for this work from a number of charities and governments including the FCDO."
