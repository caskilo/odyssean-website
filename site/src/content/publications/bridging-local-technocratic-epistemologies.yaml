title: "Bridging local and technocratic epistemologies for better non-economic loss & damage financing modalities in the Pacific"
type: research-report
summary: "Balzer and Michael propose a novel analytical framework to bridge the gap between local epistemologies and technocratic financing for non-economic loss and damage (NELD) in the Pacific. Focusing on Vanuatu, the paper integrates policy translation and anticipatory governance to better inform financing modalities, fostering long-term systemic change in complex socio-political contexts."
authors: "James Balzer and Sivendra Michael"
