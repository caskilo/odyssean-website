title: "Governance Under Fallout: Anticipating and Navigating the 2nd Order Impacts of a Nuclear Strike"
type: research-report
summary: "This report introduces a new method of futures exercise, the Horizon Summit. This approach produced structured foresight with key tools such as Causal Layered Analysis, Backcasting, and Stakeholder Mapping. These then generated scenarios to assess a joint horizon and solution scan on the underlying issues and mitigation strategies for the 2nd order effects of a nuclear strike. This was conducted especially efficiently, contributing to our aims to enhance the efficacy and delivery of prioritisation work."
authors: "Giuseppe Dal Prá, James Balzer et al."
