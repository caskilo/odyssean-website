title: "Bridging the Intangible: A Foresight-to-Policy Framework for Localising Non-Economic Loss & Damage (NELD) Financing in Samoa"
type: research-report
summary: "The Pacific Islands, including Samoa, face escalating climate risks and disproportionate loss and damage from climate change. adaptation, including irreversible harms.\n\nNon-economic loss and damage remains poorly reflected in global climate mechanisms.\n\nThis article summarises and analyses a workshop from 1 December 2025, interrogating concerns regarding global funding arrangements, particularly questions around governance, transparency, and whether they adequately address local concerns."
authors: "James Balzer"
date: "December 2025"
